<div class="flex min-h-screen flex-col">
<header class="sticky top-0 z-10 border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-950/90">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
    <a routerLink="/" class="inline-block">
      <h1 class="text-2xl font-bold tracking-tight text-amber-600 dark:text-amber-400">{{ title() }}</h1>
    </a>
    <div class="flex items-center gap-3">
      <div class="flex overflow-hidden rounded-lg border border-slate-300 dark:border-slate-700" role="group" aria-label="Language">
        @for (lang of i18n.languages; track lang) {
          <button
            type="button"
            (click)="i18n.setLang(lang)"
            [attr.aria-pressed]="i18n.lang() === lang"
            class="px-3 py-1 text-sm font-semibold uppercase transition"
            [class]="i18n.lang() === lang ? 'bg-amber-400 text-slate-900' : 'text-slate-600 hover:text-amber-600 dark:text-slate-300 dark:hover:text-amber-400'"
          >
            {{ lang }}
          </button>
        }
      </div>
      <button
        type="button"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? i18n.t('lightTheme') : i18n.t('darkTheme')"
        [attr.title]="theme.theme() === 'dark' ? i18n.t('lightTheme') : i18n.t('darkTheme')"
        class="rounded-lg border border-slate-300 p-1.5 text-slate-600 transition hover:text-amber-600 dark:border-slate-700 dark:text-slate-300 dark:hover:text-amber-400"
      >
        @if (theme.theme() === 'dark') {
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        } @else {
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
          </svg>
        }
      </button>
    </div>
  </div>
</header>

<main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8">
  <router-outlet />
</main>

@if (showFooter()) {
  <app-footer />
}
</div>

<app-scroll-top />
